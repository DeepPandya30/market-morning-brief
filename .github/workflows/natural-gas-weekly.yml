name: Weekly Natural Gas Storage

# The EIA Weekly Natural Gas Storage Report is released every Thursday at
# 10:30 a.m. eastern time. That is 20:00 IST — long after the morning brief has
# published — so this job refreshes only the gas section rather than
# regenerating the whole brief with evening-stale index and flow data.
#
# 10:30 ET is 14:30 UTC during daylight time and 15:30 UTC in winter, so the
# first slot is placed after the later of the two. Scheduled runs on GitHub are
# best-effort and routinely queue 25-90 minutes late (see morning-report.yml for
# measurements on this repo), hence several slots. Every run passes
# --require-new, so whichever slot fires first after the release does the
# commit and the rest exit as no-ops.

on:
  schedule:
    - cron: "40 15 * * 4"   # ~21:10 IST Thursday — first slot after the EST release time
    - cron: "30 16 * * 4"   # ~22:00 IST Thursday
    - cron: "30 18 * * 4"   # ~00:00 IST Friday
    - cron: "30 21 * * 4"   # ~03:00 IST Friday — last chance before the morning brief

  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if EIA has not released a newer week yet"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Serialised so two slots can never race each other into the same commit.
concurrency:
  group: natural-gas-weekly
  cancel-in-progress: false

jobs:
  refresh-natural-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Refresh EIA natural gas storage
        id: gas
        env:
          # Branch in the shell rather than with a ${{ a && '' || b }} ternary:
          # an empty string is falsy in GitHub expressions, so that form would
          # always select the fallback and --require-new could never be dropped.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced republish requested."
            python scripts/update_natural_gas.py
          else
            python scripts/update_natural_gas.py --require-new
          fi

      - name: Commit and push refreshed gas section
        if: steps.gas.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/ dashboard/ data/processed/

          if git diff --cached --quiet; then
            echo "Nothing changed on disk"
            exit 0
          fi

          git commit -m "Update natural gas storage (week ending ${{ steps.gas.outputs.week_ending }})"

          # A morning-report run could have pushed while this job was working.
          git pull --rebase origin main
          git push origin main

      - name: Report no-op
        if: steps.gas.outputs.changed != 'true'
        run: echo "No newer EIA release available — dashboard left unchanged."
