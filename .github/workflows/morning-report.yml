name: Morning Market Report

on:
  schedule:
    # GitHub Actions cron is UTC (IST = UTC + 5:30) and scheduled runs are
    # best-effort: they queue behind GitHub's global backlog. Measured on this
    # repo over four trading days (2026-08-06 to 2026-08-11):
    #
    #   slots at 21:50-23:20 UTC  ->  25-66 min late   (quiet window)
    #   slots at 00:20-02:20 UTC  ->  93-205 min late  (peak congestion)
    #
    # So the *start* time can never be trusted to land on 07:50 IST — on
    # 2026-08-06 every attempt missed the publish window and nothing was
    # published at all. Instead of chasing the start time, the job starts early
    # in the quiet UTC window and then sleeps until 07:50 IST before generating,
    # so the report publishes at the same time every day regardless of backlog.
    #
    # The first four slots are the reliable ones (quiet UTC window, ~30-60 min
    # late, so the job is alive and waiting well before 07:50 IST). The last
    # three are fallbacks in case GitHub drops the early slots entirely.
    #
    # Slots before 00:00 UTC use days 0-4, because 22:20 UTC Sunday is already
    # 03:50 IST Monday. Slots at/after 00:00 UTC use days 1-5.
    - cron: "20 22 * * 0-4"   # ~03:50 IST + backlog -> waits until 07:50
    - cron: "50 22 * * 0-4"   # ~04:20 IST + backlog -> waits until 07:50
    - cron: "20 23 * * 0-4"   # ~04:50 IST + backlog -> waits until 07:50
    - cron: "50 23 * * 0-4"   # ~05:20 IST + backlog -> waits until 07:50
    - cron: "20 0 * * 1-5"    # ~05:50 IST — fallback
    - cron: "20 1 * * 1-5"    # ~06:50 IST — fallback
    - cron: "20 2 * * 1-5"    # ~07:50 IST — last-chance fallback

  workflow_dispatch:
    inputs:
      event_date:
        description: "Corporate event calendar date (e.g. 2026-08-12, 12-08-2026, '12 August'). Blank = today IST."
        required: false
        default: ""

permissions:
  contents: write

# Scheduled runs are serialised so two of them can never publish the same day
# twice. Manual runs get their own group, otherwise clicking "Run workflow"
# would queue behind a scheduled job that is still sleeping until 07:50 IST.
concurrency:
  group: morning-market-report-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # Longest possible wait (started ~04:00 IST, publishes 07:50 IST) plus the
    # generation itself, with headroom under the 6 hour job ceiling.
    timeout-minutes: 330

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          event = os.environ.get("EVENT_NAME", "schedule")

          # The brief is published at the same time every morning, early enough
          # to read before the 09:15 IST market open.
          TARGET = now.replace(hour=7, minute=50, second=0, microsecond=0)
          # After this a pre-market report has no value, so a very late run
          # exits instead of publishing a stale brief.
          LATEST = now.replace(hour=9, minute=10, second=0, microsecond=0)
          # Guards against a wildly early start burning a runner for hours.
          MAX_WAIT_SECONDS = 4 * 3600


          def published_today():
              info = Path("docs/build_info.json")
              if not info.exists():
                  return None
              try:
                  stamp = json.loads(info.read_text(encoding="utf-8"))["generated_at_iso"]
                  last = datetime.fromisoformat(stamp).astimezone(IST)
              except Exception:
                  return None
              return last if last.date() == now.date() else None


          def decide():
              if event != "schedule":
                  return True, 0, f"manual {event} run — publishing now"
              if now.weekday() > 4:
                  return False, 0, f"{now:%A} is not a trading day in IST"

              last = published_today()
              if last is not None:
                  return False, 0, f"report already published today at {last:%H:%M} IST"

              if now > LATEST:
                  return False, 0, (
                      f"{now:%H:%M} IST is past the {LATEST:%H:%M} IST cutoff — "
                      "too late to be a pre-market brief"
                  )

              wait = int((TARGET - now).total_seconds())
              if wait <= 0:
                  return True, 0, (
                      f"started at {now:%H:%M} IST, past the {TARGET:%H:%M} IST "
                      "target — publishing immediately"
                  )
              if wait > MAX_WAIT_SECONDS:
                  return False, 0, (
                      f"{now:%H:%M} IST is more than "
                      f"{MAX_WAIT_SECONDS // 3600}h before the {TARGET:%H:%M} IST "
                      "target — leaving it to a later slot"
                  )
              return True, wait, (
                  f"started at {now:%H:%M} IST — waiting {wait // 60} min to "
                  f"publish at {TARGET:%H:%M} IST"
              )


          should_run, wait_seconds, reason = decide()
          verdict = "RUN" if should_run else "SKIP"
          print(f"{verdict}: {reason}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
              handle.write(f"wait_seconds={wait_seconds}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### {verdict}\n\n{reason}\n\nChecked at {now:%Y-%m-%d %H:%M:%S} IST.\n")
          PY

      - name: Wait until 07:50 IST
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.wait_seconds != '0'
        run: |
          echo "Sleeping ${{ steps.gate.outputs.wait_seconds }}s to publish at 07:50 IST..."
          sleep ${{ steps.gate.outputs.wait_seconds }}
          echo "Woke at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Re-sync after waiting
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Confirm nothing was published while waiting
        id: recheck
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)

          # A manual run can publish while this job is asleep, so the freshly
          # synced build stamp is checked once more before regenerating.
          last = None
          info = Path("docs/build_info.json")
          if info.exists():
              try:
                  stamp = json.loads(info.read_text(encoding="utf-8"))["generated_at_iso"]
                  parsed = datetime.fromisoformat(stamp).astimezone(IST)
                  if parsed.date() == now.date():
                      last = parsed
              except Exception:
                  last = None

          should_run = last is None
          reason = (
              f"{now:%H:%M} IST — no report published today yet, generating"
              if should_run
              else f"another run published today's report at {last:%H:%M} IST"
          )
          print(f"{'RUN' if should_run else 'SKIP'}: {reason}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.recheck.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.recheck.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Generate morning report
        if: steps.recheck.outputs.should_run == 'true'
        env:
          # Blank on scheduled runs, so the event calendar defaults to today IST.
          MARKET_EVENT_DATE: ${{ inputs.event_date }}
        run: |
          python scripts/generate_report.py

      - name: Force build timestamp
        if: steps.recheck.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import json
          import re

          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          ts = now.strftime("%d %b %Y, %I:%M:%S %p IST")

          Path("docs").mkdir(exist_ok=True)
          Path("docs/.nojekyll").write_text("", encoding="utf-8")

          Path("docs/build_info.json").write_text(
              json.dumps(
                  {
                      "generated_at": ts,
                      "generated_at_iso": now.isoformat(),
                      "source": "github-actions"
                  },
                  indent=2
              ),
              encoding="utf-8"
          )

          for file_name in ["docs/index.html", "dashboard/index.html"]:
              path = Path(file_name)
              if not path.exists():
                  continue

              html = path.read_text(encoding="utf-8")

              meta_tag = f'<meta name="dashboard-build-time" content="{ts}">'
              if 'name="dashboard-build-time"' in html:
                  html = re.sub(
                      r'<meta name="dashboard-build-time" content="[^"]*">',
                      meta_tag,
                      html
                  )
              else:
                  html = html.replace("</head>", f"  {meta_tag}\n</head>", 1)

              path.write_text(html, encoding="utf-8")

          print(f"Forced dashboard build timestamp: {ts}")
          PY

      - name: Show generated date
        if: steps.recheck.outputs.should_run == 'true'
        run: |
          echo "Latest docs build info:"
          cat docs/build_info.json || true

          echo ""
          echo "Generated report files:"
          ls -la docs || true
          ls -la reports || true
          ls -la data/processed || true
          ls -la data/raw || true

      - name: Commit and push updated dashboard
        if: steps.recheck.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/ dashboard/ reports/ data/processed/ data/raw/

          if git diff --cached --quiet; then
            echo "No generated dashboard changes found"
          else
            git commit -m "Update morning market report"
            git push origin main
          fi
