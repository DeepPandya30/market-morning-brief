name: Weekly Crude Oil Status

# The EIA Weekly Petroleum Status Report is released every Wednesday: the data
# tables at 10:30 a.m. eastern and the Highlights write-up at 1:00 p.m. eastern.
# 1:00 p.m. ET is 22:30 IST during US daylight time and 23:30 IST in winter —
# long after the morning brief has published — so this job refreshes only the
# crude section rather than regenerating the whole brief with evening-stale
# index and flow data. The new week is then carried natively by the next
# morning's brief.
#
# 1:00 p.m. ET is 17:00 UTC in summer and 18:00 UTC in winter, so the first slot
# sits after the later of the two. Scheduled runs on GitHub are best-effort and
# routinely queue 25-90 minutes late (see morning-report.yml for measurements on
# this repo), hence several slots. Every run passes --require-new, so whichever
# slot fires first after the release does the commit and the rest exit as
# no-ops.
#
# When Monday is a US federal holiday the whole release slips to Thursday, which
# is what the Thursday slots are for — on a normal week they find nothing newer
# and exit immediately.

on:
  schedule:
    - cron: "30 18 * * 3"   # ~00:00 IST Thursday — first slot after the EST release time
    - cron: "30 19 * * 3"   # ~01:00 IST Thursday
    - cron: "30 21 * * 3"   # ~03:00 IST Thursday — last chance before the morning brief
    - cron: "30 18 * * 4"   # ~00:00 IST Friday — holiday weeks, release slipped to Thursday
    - cron: "30 21 * * 4"   # ~03:00 IST Friday — holiday-week last chance

  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if EIA has not released a newer week yet"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Serialised so two slots can never race each other into the same commit.
concurrency:
  group: petroleum-weekly
  cancel-in-progress: false

jobs:
  refresh-petroleum:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with remote main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Refresh EIA crude oil status
        id: crude
        env:
          # Branch in the shell rather than with a ${{ a && '' || b }} ternary:
          # an empty string is falsy in GitHub expressions, so that form would
          # always select the fallback and --require-new could never be dropped.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced republish requested."
            python scripts/update_petroleum.py
          else
            python scripts/update_petroleum.py --require-new
          fi

      - name: Commit and push refreshed crude section
        if: steps.crude.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/ dashboard/ data/processed/

          if git diff --cached --quiet; then
            echo "Nothing changed on disk"
            exit 0
          fi

          git commit -m "Update crude oil inventories (week ending ${{ steps.crude.outputs.week_ending }})"

          # A morning-report run could have pushed while this job was working.
          git pull --rebase origin main
          git push origin main

      - name: Report no-op
        if: steps.crude.outputs.changed != 'true'
        run: echo "No newer EIA release available — dashboard left unchanged."
